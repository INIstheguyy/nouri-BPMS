project_id = "nouri-operations"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false
port = 55329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password", "http://localhost:5173/invite"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false

[auth.email]
# Keep the email/password provider enabled. Global auth.enable_signup remains false,
# so only Admin Auth invitations/creation can provision staff accounts.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.invite-staff]
enabled = true
verify_jwt = true
entrypoint = "./functions/invite-staff/index.ts"

[functions.update-staff-access]
enabled = true
verify_jwt = true
entrypoint = "./functions/update-staff-access/index.ts"

[functions.update-staff-role]
enabled = true
verify_jwt = true
entrypoint = "./functions/update-staff-role/index.ts"

[functions.create-public-order]
enabled = true
verify_jwt = false
entrypoint = "./functions/create-public-order/index.ts"

[functions.initialize-prepaid-payment]
enabled = true
verify_jwt = true
entrypoint = "./functions/initialize-prepaid-payment/index.ts"

[functions.payment-webhook-mock]
enabled = true
verify_jwt = false
entrypoint = "./functions/payment-webhook-mock/index.ts"

[analytics]
enabled = false
